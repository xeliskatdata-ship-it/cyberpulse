name: StatCyberMatrix Pipeline

on:
  schedule:
    - cron: '0 */3 * * *'  # Toutes les 3 heures (j'ai divisé l'egress par 3)
  workflow_dispatch:       # Lancement manuel possible

# Token en lecture seule : le pipeline n'écrit jamais dans le repo, il charge dans Neon
permissions:
  contents: read

# Évite deux runs qui se marchent dessus sur la base (cron + dispatch manuel)
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions pinnées par SHA (protège du scénario tj-actions : tag mobile réécrit chez l'upstream)
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false   # ne laisse pas le GITHUB_TOKEN dans .git/config

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary
          python -m spacy download en_core_web_sm || true
          python -m spacy download fr_core_news_sm || true

      - name: Run acquisition
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python src/acquisition.py

      - name: Run cleaning
        run: python src/cleaning.py

      - name: Load to Neon
        env:
          POSTGRES_USER: ${{ secrets.NEON_USER }}
          POSTGRES_PASSWORD: ${{ secrets.NEON_PASSWORD }}
          POSTGRES_DB: ${{ secrets.NEON_DBNAME }}
          POSTGRES_HOST: ${{ secrets.NEON_HOST }}
          POSTGRES_PORT: "5432"
        run: python db/load_to_db.py

      - name: Refresh marts on Neon
        env:
          NEON_HOST: ${{ secrets.NEON_HOST }}
          NEON_USER: ${{ secrets.NEON_USER }}
          NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
          NEON_DBNAME: ${{ secrets.NEON_DBNAME }}
        run: python .github/scripts/refresh_marts.py